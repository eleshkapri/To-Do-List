<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskflow — Minimalist Task Manager</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Backdrop for Mobile -->
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <!-- Minimalist Left Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="brand">
                    <div class="brand-logo">
                        <i class="fa-solid fa-check-double"></i>
                    </div>
                    <div class="brand-info">
                        <h2>Taskflow</h2>
                        <span class="user-status">My Workspace</span>
                    </div>
                </div>
                <button class="icon-btn mobile-close-btn" id="mobile-sidebar-close" aria-label="Close sidebar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Primary Quick Add Button -->
            <button class="sidebar-add-btn" id="sidebar-quick-add-btn">
                <i class="fa-solid fa-plus"></i>
                <span>Add task</span>
                <kbd class="shortcut-badge">N</kbd>
            </button>

            <!-- Search Bar -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="global-search" placeholder="Search tasks... ( / )" />
            </div>

            <!-- Navigation / Smart Views -->
            <div class="nav-group">
                <div class="group-title">VIEWS</div>
                <nav class="nav-list">
                    <button class="nav-btn" data-view="inbox">
                        <span class="nav-btn-left">
                            <i class="fa-solid fa-inbox nav-icon icon-inbox"></i>
                            <span>Inbox</span>
                        </span>
                        <span class="nav-count" id="count-inbox">0</span>
                    </button>
                    <button class="nav-btn active" data-view="today">
                        <span class="nav-btn-left">
                            <i class="fa-regular fa-calendar-check nav-icon icon-today"></i>
                            <span>Today</span>
                        </span>
                        <span class="nav-count" id="count-today">0</span>
                    </button>
                    <button class="nav-btn" data-view="upcoming">
                        <span class="nav-btn-left">
                            <i class="fa-regular fa-calendar-days nav-icon icon-upcoming"></i>
                            <span>Upcoming</span>
                        </span>
                        <span class="nav-count" id="count-upcoming">0</span>
                    </button>
                    <button class="nav-btn" data-view="starred">
                        <span class="nav-btn-left">
                            <i class="fa-regular fa-star nav-icon icon-starred"></i>
                            <span>Important</span>
                        </span>
                        <span class="nav-count" id="count-starred">0</span>
                    </button>
                    <button class="nav-btn" data-view="completed">
                        <span class="nav-btn-left">
                            <i class="fa-regular fa-circle-check nav-icon icon-completed"></i>
                            <span>Completed</span>
                        </span>
                        <span class="nav-count" id="count-completed">0</span>
                    </button>
                    <button class="nav-btn" data-view="notes">
                        <span class="nav-btn-left">
                            <i class="fa-regular fa-note-sticky nav-icon icon-notes"></i>
                            <span>Quick Notes</span>
                        </span>
                        <span class="nav-count" id="count-notes">0</span>
                    </button>
                </nav>
            </div>

            <!-- Projects Section -->
            <div class="nav-group">
                <div class="group-header">
                    <span class="group-title">PROJECTS</span>
                    <button class="icon-btn-xs" id="btn-add-project" title="Add project">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <div class="projects-list" id="projects-list">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>

            <!-- Tags Filter Section -->
            <div class="nav-group">
                <div class="group-title">TAGS</div>
                <div class="tags-list" id="tags-list">
                    <button class="tag-chip active" data-tag="all">#all</button>
                    <button class="tag-chip" data-tag="urgent">#urgent</button>
                    <button class="tag-chip" data-tag="work">#work</button>
                    <button class="tag-chip" data-tag="dev">#dev</button>
                    <button class="tag-chip" data-tag="design">#design</button>
                </div>
            </div>

            <!-- Sidebar Bottom / Footer -->
            <div class="sidebar-bottom">
                <div class="progress-widget">
                    <div class="progress-info">
                        <span>Daily Progress</span>
                        <strong id="progress-text">0%</strong>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>

                <div class="footer-controls">
                    <span class="storage-tag"><i class="fa-solid fa-shield-halved"></i> Local Sync</span>
                    <button class="theme-btn" id="theme-toggle" title="Toggle dark/light mode">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Task Workspace -->
        <main class="main-workspace">
            <!-- Workspace Header -->
            <header class="workspace-header">
                <div class="header-left">
                    <button class="icon-btn mobile-menu-btn" id="mobile-sidebar-toggle" aria-label="Toggle menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div>
                        <div class="view-title-row">
                            <h1 id="view-title">Today</h1>
                            <span class="view-task-badge" id="view-task-badge">0 tasks</span>
                        </div>
                        <p class="view-subtitle" id="view-subtitle">Saturday, 22 August</p>
                    </div>
                </div>

                <div class="header-right">
                    <!-- Filter & Sort Options -->
                    <div class="header-filter-group">
                        <select id="priority-filter" class="clean-select" aria-label="Filter by priority">
                            <option value="all">All Priorities</option>
                            <option value="p1">🔴 P1 High</option>
                            <option value="p2">🟡 P2 Medium</option>
                            <option value="p3">🔵 P3 Low</option>
                            <option value="p4">⚪ P4 Routine</option>
                        </select>

                        <select id="sort-filter" class="clean-select" aria-label="Sort tasks">
                            <option value="dueDate-asc">Due Date</option>
                            <option value="priority-desc">Priority</option>
                            <option value="title-asc">Alphabetical</option>
                            <option value="created-desc">Date Added</option>
                        </select>
                    </div>
                </div>
            </header>

            <!-- Active View: Tasks Pane -->
            <div class="content-pane active" id="pane-tasks-view">
                <!-- Todoist-Style Inline Task Add Box -->
                <div class="inline-task-creator" id="inline-creator">
                    <div class="creator-input-row">
                        <div class="circle-placeholder">
                            <i class="fa-solid fa-plus"></i>
                        </div>
                        <input type="text" id="task-input-title" placeholder="Add a task... (Press Enter to save)" />
                    </div>
                    <div class="creator-details-row" id="creator-details">
                        <input type="text" id="task-input-desc" placeholder="Description or notes (optional)..." />
                        <div class="creator-chips-row">
                            <div class="chip-group">
                                <input type="date" id="task-input-date" class="chip-date-input" title="Due Date" />
                                
                                <select id="task-input-priority" class="chip-select">
                                    <option value="p4">⚪ P4 Routine</option>
                                    <option value="p3">🔵 P3 Low</option>
                                    <option value="p2" selected>🟡 P2 Medium</option>
                                    <option value="p1">🔴 P1 High</option>
                                </select>

                                <select id="task-input-project" class="chip-select">
                                    <!-- Populated via JS -->
                                </select>

                                <select id="task-input-tag" class="chip-select">
                                    <option value="general">#general</option>
                                    <option value="urgent">#urgent</option>
                                    <option value="work">#work</option>
                                    <option value="dev">#dev</option>
                                    <option value="design">#design</option>
                                </select>
                            </div>
                            <div class="creator-actions">
                                <button type="button" class="btn btn-text" id="cancel-inline-add">Clear</button>
                                <button type="button" class="btn btn-primary btn-sm" id="submit-inline-add">Add Task</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Task Groups / List -->
                <div class="tasks-container">
                    <!-- Empty State -->
                    <div class="empty-state hidden" id="empty-state">
                        <div class="empty-icon">
                            <i class="fa-regular fa-circle-check"></i>
                        </div>
                        <h3>All tasks complete!</h3>
                        <p id="empty-state-msg">Enjoy your day or add a new task to stay ahead.</p>
                    </div>

                    <!-- Active Task List -->
                    <ul class="task-list" id="active-tasks-list">
                        <!-- Rendered dynamically -->
                    </ul>

                    <!-- Completed Tasks Accordion -->
                    <div class="completed-section" id="completed-section">
                        <button class="completed-toggle-btn" id="completed-toggle-btn">
                            <i class="fa-solid fa-chevron-right toggle-arrow" id="completed-toggle-arrow"></i>
                            <span>Completed (<span id="completed-accordion-count">0</span>)</span>
                        </button>
                        <ul class="task-list completed-list hidden" id="completed-tasks-list">
                            <!-- Rendered dynamically -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Active View: Notes Pane -->
            <div class="content-pane" id="pane-notes-view">
                <div class="notes-header">
                    <div>
                        <h2>Quick Notes & Brain Dump</h2>
                        <p>Jot down thoughts, temporary reminders, and drafts.</p>
                    </div>
                    <button class="btn btn-primary btn-sm" id="btn-add-note">
                        <i class="fa-solid fa-plus"></i> New Note
                    </button>
                </div>
                <div class="notes-grid" id="notes-grid">
                    <!-- Rendered dynamically -->
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: Edit Task -->
    <div class="modal-overlay" id="edit-modal" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Edit Task</h3>
                <button class="icon-btn modal-close-btn" id="edit-modal-close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="edit-task-form" class="modal-form">
                <input type="hidden" id="edit-task-id" />

                <div class="form-group">
                    <label for="edit-title">Task Title <span class="req">*</span></label>
                    <input type="text" id="edit-title" required />
                </div>

                <div class="form-group">
                    <label for="edit-desc">Description / Notes</label>
                    <textarea id="edit-desc" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="edit-project">Project</label>
                        <select id="edit-project"></select>
                    </div>
                    <div class="form-group flex-1">
                        <label for="edit-priority">Priority</label>
                        <select id="edit-priority">
                            <option value="p1">🔴 P1 High</option>
                            <option value="p2">🟡 P2 Medium</option>
                            <option value="p3">🔵 P3 Low</option>
                            <option value="p4">⚪ P4 Routine</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="edit-date">Due Date</label>
                        <input type="date" id="edit-date" />
                    </div>
                    <div class="form-group flex-1">
                        <label for="edit-tag">Tag</label>
                        <select id="edit-tag">
                            <option value="general">#general</option>
                            <option value="urgent">#urgent</option>
                            <option value="work">#work</option>
                            <option value="dev">#dev</option>
                            <option value="design">#design</option>
                        </select>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-text" id="edit-modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Add Project -->
    <div class="modal-overlay" id="project-modal" aria-hidden="true">
        <div class="modal-card modal-sm">
            <div class="modal-header">
                <h3>New Project</h3>
                <button class="icon-btn modal-close-btn" id="project-modal-close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="project-form" class="modal-form">
                <div class="form-group">
                    <label for="project-name">Project Name <span class="req">*</span></label>
                    <input type="text" id="project-name" placeholder="e.g. Side Project, Fitness" required />
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <div class="color-options">
                        <label class="color-dot-label">
                            <input type="radio" name="proj-color" value="#ef4444" checked />
                            <span class="color-dot" style="background-color: #ef4444;"></span>
                        </label>
                        <label class="color-dot-label">
                            <input type="radio" name="proj-color" value="#f59e0b" />
                            <span class="color-dot" style="background-color: #f59e0b;"></span>
                        </label>
                        <label class="color-dot-label">
                            <input type="radio" name="proj-color" value="#10b981" />
                            <span class="color-dot" style="background-color: #10b981;"></span>
                        </label>
                        <label class="color-dot-label">
                            <input type="radio" name="proj-color" value="#06b6d4" />
                            <span class="color-dot" style="background-color: #06b6d4;"></span>
                        </label>
                        <label class="color-dot-label">
                            <input type="radio" name="proj-color" value="#4f46e5" />
                            <span class="color-dot" style="background-color: #4f46e5;"></span>
                        </label>
                        <label class="color-dot-label">
                            <input type="radio" name="proj-color" value="#ec4899" />
                            <span class="color-dot" style="background-color: #ec4899;"></span>
                        </label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-text" id="project-modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-box" id="toast-box"></div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
